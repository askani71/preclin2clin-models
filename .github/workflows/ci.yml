name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas pyarrow scikit-learn pytest ruff
      - name: Lint
        run: ruff check src/python tests/python
      - name: Test
        run: pytest tests/python/

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install dependencies
        run: Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'
      - name: Test
        run: Rscript -e 'testthat::test_dir("tests/r")'
